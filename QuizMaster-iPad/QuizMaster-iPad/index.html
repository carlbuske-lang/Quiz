function inspector(q){const k=f=>`data-k="i${q.id}${f}"`,L=a=>esc((a||[]).join('\n')),u=(f,x)=>`onchange="upd('${q.id}','${f}',${x})"`,ur=(f,x)=>`onchange="upd('${q.id}','${f}',${x});render()"`;
  const r=Q.rounds[ui.edR],i=r.qs.indexOf(q),f=fmtOf(q),F=FMT[f],imgs=(FILES||[]).filter(x=>isImg(x.name));
  const solF=`<label class="fld"><span>${f==='artist'?'Gesuchter Künstler':f==='risk'?'Beispiele für richtige Antworten':'Lösung'}</span><textarea ${k('s')} style="min-height:48px" ${u('show',"this.value.trim()||null")}>${esc(solution(q))}</textarea><span class="hint">So steht sie beim Bewerten neben den Punkten.</span></label>`;
  const solP=s=>`<div class="fld"><span>Lösung</span><div class="solp">${esc(s)||'<span class="faint">Erscheint, sobald alles eingetragen ist</span>'}</div></div>`;
  const halfF=q.type==='std'&&f!=='tf'?`<label class="fld"><span>Teilweise richtig, 1 Punkt</span><input type="text" ${k('hf')} value="${esc((Array.isArray(q.half)?q.half:[]).join(', '))}" placeholder="z. B. nur der Nachname" ${ur('half',"this.value.split(',').map(x=>x.trim()).filter(Boolean).length?this.value.split(',').map(x=>x.trim()).filter(Boolean):null")}></label>`:'';
  const numF=`<div class="two"><label class="fld"><span>Richtiger Wert</span><input type="number" step="any" ${k('nv')} value="${q.val??''}" ${u('val',"this.value===''?null:+this.value")}></label><label class="fld"><span>Einheit</span><input type="text" ${k('nu')} value="${esc(q.unit||'')}" placeholder="z. B. km" ${u('unit',"this.value.trim()||null")}></label></div>`;
  let spec='';
  switch(f){
    case 'tf':spec=`<div class="fld"><span>Die Aussage ist</span><div class="seg big">${[[true,'Wahr'],[false,'Falsch']].map(([v,l])=>`<button class="${(q.tf!==false)===v?'on':''}" onclick="upd('${q.id}','tf',${v});render()">${l}</button>`).join('')}</div></div>`;break;
    case 'mc':{const o=q.opts&&q.opts.length?q.opts:['',''];spec=`<div class="fld"><span>Antworten</span><div class="mcedit">${o.map((x,j)=>`<div class="mcr ${q.correct===ABC[j]?'ok':''}"><button class="mcl" title="Als richtig markieren" onclick="upd('${q.id}','correct','${ABC[j]}');render()">${q.correct===ABC[j]?ic('check',12):ABC[j]}</button><input type="text" ${k('o'+j)} value="${esc(x)}" placeholder="Antwort ${ABC[j]}" onchange="setOpt('${q.id}',${j},this.value)">${o.length>2?`<button class="btn icon plain" title="Entfernen" onclick="delOpt('${q.id}',${j})">${ic('trash',13)}</button>`:''}</div>`).join('')}</div>
      ${o.length<8?`<button class="btn plain small" style="margin-top:6px" onclick="setOpt('${q.id}',${o.length},'')">${ic('plus',12)}Antwort</button>`:''}<span class="hint">Auf den Buchstaben tippen, um die richtige Antwort festzulegen.</span></div>`;break}
    case 'est':spec=numF+`<div class="two"><label class="fld"><span>Volle Punkte bis ±${q.pct?' %':''}</span><input type="number" step="any" min="0" ${k('nf')} value="${q.full??''}" ${u('full',"this.value===''?null:+this.value")}></label><label class="fld"><span>1 Punkt bis ±${q.pct?' %':''}</span><input type="number" step="any" min="0" ${k('nh')} value="${typeof q.half==='number'?q.half:''}" placeholder="leer = keine" ${u('half',"this.value===''?null:+this.value")}></label></div>
      <label class="row" style="justify-content:space-between;margin:0 0 14px"><span>Abweichung in Prozent</span><span class="toggle"><input type="checkbox" ${q.pct?'checked':''} onchange="upd('${q.id}','pct',this.checked||null)"><span></span></span></label>`;break;
    case 'tiebreak':spec=numF+`<div class="note0">Die Stechfrage zählt nicht zu den Punkten. Haben Teams gleich viele Punkte, liegt vorn, wer näher am richtigen Wert ist. Beim Auswerten trägst du die Zahl jedes Teams ein.</div>`;break;
    case 'multi':spec=`<label class="fld"><span>Teilantworten, eine pro Zeile</span><textarea ${k('mp')} style="min-height:72px" ${ur('parts',"lines(this.value).map(x=>x.split('/').map(y=>y.trim()).filter(Boolean))")}>${esc((q.parts||[]).map(p=>p.join(' / ')).join('\n'))}</textarea><span class="hint">Gleichwertige Schreibweisen mit Schrägstrich trennen, z. B. „Fred / George“.</span></label>`;break;
    case 'order':spec=`<label class="fld"><span>Einträge in der richtigen Reihenfolge, einer pro Zeile</span><textarea ${k('or')} style="min-height:110px" ${ur('items','lines(this.value)')}>${L(q.items)}</textarea><span class="hint">Die Teams sehen sie gemischt mit Buchstaben A, B, C und schreiben die Buchstaben in die richtige Reihenfolge.</span></label>`+solP(solution(q));break;
    case 'match':spec=`<label class="fld"><span>Paare, eines pro Zeile: links = rechts</span><textarea ${k('pa')} style="min-height:110px" placeholder="Berlin = Spree" ${ur('pairs',"lines(this.value).map(x=>x.split('=').map(y=>y.trim())).filter(x=>x.length>1&&x[0]&&x[1])")}>${esc((q.pairs||[]).map(p=>p.join(' = ')).join('\n'))}</textarea><span class="hint">Die rechte Seite wird gemischt. Pro richtigem Paar gibt es 1 Punkt.</span></label>`+solP(solution(q));break;
    case 'cloze':spec=solP(solution(q));break;
    case 'music':spec=`<div class="fld"><span>Gefragt wird nach</span><div class="tagpick">${ASK.map(a=>`<button class="${(q.ask||[]).includes(a)?'on':''}" onclick="toggleAsk('${q.id}','${a}')">${a}</button>`).join('')}</div><span class="hint">1 Punkt pro richtigem Teil.</span></div>
      ${(q.ask||[]).map(a=>`<label class="fld"><span>${a}</span><input type="text" ${k('a'+a)} value="${esc((q.ans||{})[a]||'')}" onchange="setAns('${q.id}','${a}',this.value)"></label>`).join('')}`;break;
    case 'hint':spec=`<label class="fld"><span>Hinweise, schwer bis leicht</span><textarea ${k('hi')} style="min-height:150px" ${u('hints','lines(this.value)')}>${L(q.hints)}</textarea><span class="hint">Einer pro Zeile.</span></label>
      <label class="fld"><span>Punkte je Hinweis</span><input type="text" ${k('pt')} value="${esc((q.pts||[]).join(', '))}" ${ur('pts',"this.value.split(/[,;\\s]+/).filter(Boolean).map(Number)")}></label>`+solF;break;
    case 'artist':{const n=Math.max((q.hints||[]).length,(q.media||[]).length);spec=solF+`<div class="fld"><span>Songs, vom unbekanntesten zum bekanntesten</span><div class="songs">${Array.from({length:n},(_,j)=>{const m=(q.media||[])[j]||{};return `<div class="song"><span class="n">${j+1}</span><div class="grow"><input type="text" ${k('st'+j)} value="${esc((q.hints||[])[j]||'')}" placeholder="Songtitel" onchange="setSong('${q.id}',${j},'t',this.value)"><div class="sgl"><input type="text" ${k('sl'+j)} value="${esc(m.target||'')}" placeholder="Spotify-Link" onchange="setSong('${q.id}',${j},'l',this.value)"><input type="number" min="0" ${k('ss'+j)} value="${m.start??''}" placeholder="ab Sek." title="Startsekunde. Leer: wie im Quiz eingestellt" onchange="updM('${q.id}',${j},'start',this.value===''?null:+this.value);if(this.value==='')delete findQ('${q.id}').media[${j}].from;else findQ('${q.id}').media[${j}].from='fixed';saveQuiz()"></div></div><span class="p">${(q.pts||[])[j]??''} P.</span>${m.target?`<button class="btn icon plain" title="Anhören" onclick="runMedia(findQ('${q.id}').media[${j}])">${ic('play',11)}</button>`:''}<button class="btn icon plain" title="Entfernen" onclick="delSong('${q.id}',${j})">${ic('trash',13)}</button></div>`}).join('')}</div>
      <button class="btn plain small" style="margin-top:6px" onclick="setSong('${q.id}',${n},'t','')">${ic('plus',12)}Song</button><span class="hint">Wer nach dem ersten Song richtig liegt, bekommt die meisten Punkte. Jeder Song spielt ${((q.media||[])[0]||{}).dur||(Q.meta.play||{}).dur||30} Sekunden. Mit „ab Sek.“ legst du fest, wo er startet, sonst gilt der Startpunkt aus den Einstellungen.</span></div>
      <label class="fld"><span>Punkte je Song</span><input type="text" ${k('pt')} value="${esc((q.pts||[]).join(', '))}" ${ur('pts',"this.value.split(/[,;\\s]+/).filter(Boolean).map(Number)")}></label>`;break}
    case 'sheet':spec=`<div class="two"><label class="fld"><span>Felder auf dem Bogen</span><input type="number" min="0" ${k('sf')} value="${q.fields??''}" placeholder="z. B. 24" ${ur('fields',"this.value===''?null:+this.value")}></label><label class="fld"><span>Punkte je Feld</span><input type="number" min="1" ${k('sp')} value="${q.per??1}" ${ur('per','+this.value||1')}></label></div>`+solF;break;
    case 'risk':spec=solF;break;
    default:spec=hasSlots(q)?'':solF+halfF}
  if(['map','picture','zoom','sheet','open'].includes(f)&&(hasSlots(q)||f!=='open'))spec=(hasSlots(q)&&f==='sheet'?'':spec)+slotsEditor(q);
  const showMax=!['hint','artist','risk','tiebreak','match','cloze','music'].includes(f)&&!(f==='sheet'&&q.fields)&&!hasSlots(q);
  return `<div class="row" style="justify-content:space-between;margin-bottom:12px"><b style="font-size:15px">Frage ${i+1}</b><div class="row"><button class="btn icon plain" title="Nach oben" onclick="moveQ(${i},-1)">${ic('up',14)}</button><button class="btn icon plain" title="Nach unten" onclick="moveQ(${i},1)">${ic('down',14)}</button><button class="btn icon plain" title="Duplizieren" onclick="dupQ(${i})">${ic('copy',14)}</button>${r.qs[i+1]?`<button class="btn icon plain" title="Mit der Frage darunter zu einem Block zusammenführen" onclick="mergeNext(${i})">${ic('layers',14)}</button>`:''}<button class="btn icon plain danger" title="Löschen" onclick="delQ(${i})">${ic('trash',14)}</button></div></div>
   <button class="fmtpick" onclick="pickFmt('${q.id}')"><span class="fi">${ic(F.i,18)}</span><span class="grow"><b>${F.l}</b><span>${F.d}</span></span><span class="muted small">Ändern</span></button>
   <label class="fld"><span>${f==='tf'?'Aussage':f==='cloze'?'Text mit Lücken':'Frage'}</span><textarea ${k('t')} ${ur('text','this.value')}>${esc(q.text)}</textarea>${f==='cloze'?'<span class="hint">Lücken in geschweifte Klammern setzen, z. B.: Münster liegt in {Westfalen}.</span>':''}</label>
   ${spec}
   <div class="two"><label class="fld"><span>Zeit in Minuten</span><input type="number" min="0" step="0.5" ${k('ti')} value="${q.time??0}" ${u('time','+this.value')}></label>
     ${showMax?`<label class="fld"><span>Höchstens Punkte</span><input type="number" min="0" ${k('mx')} value="${q.max??2}" ${u('max','+this.value')}></label>`:`<div class="fld"><span>Punkte</span><div class="solp">${f==='tiebreak'?'Zählt nicht':f==='risk'?'0, 1, 2, 3 oder 5':(f==='hint'||f==='artist')?'Je nach Hinweis':`bis ${fmtMax(q)}`}</div></div>`}</div>
   <label class="fld"><span>Bewertungshinweis</span><input type="text" ${k('rl')} value="${esc(q.rule||'')}" placeholder="${esc(rule({...q,rule:''}))||'z. B. ± 1 Jahr gilt als richtig'}" ${u('rule',"this.value.trim()||null")}></label>
   <div class="fld"><span>Labels</span><div class="tagpick">${TAGS.map(([k,l,i])=>`<button class="${(q.tags||[]).includes(k)?'on':''}" onclick="toggleTag('${q.id}','${k}')">${ic(i)}${l}</button>`).join('')}</div></div>
   <label class="row" style="justify-content:space-between;margin:4px 0 14px"><span><span style="display:block">Auf eigenem Papierbogen</span><span class="faint small">Zum Rundenstart austeilen, danach einsammeln</span></span><span class="toggle"><input type="checkbox" ${q.paper?'checked':''} onchange="upd('${q.id}','paper',this.checked||null)"><span></span></span></label>
   ${f==='artist'?'':mediaEditor(q)}
   ${imgs.length?`<label class="fld" style="margin-top:14px"><span>Bild zur Frage</span><select ${u('image','this.value||null')}><option value="">Kein Bild</option>${imgs.map(x=>`<option ${q.image===x.name?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>`:''}`}
function mediaEditor(q){return `<div class="gt">Medien</div><p class="faint small" style="margin:-4px 0 10px">Spotify, YouTube, Webseiten oder Dateien. Beim Durchführen erscheinen sie als Abspielknopf direkt unter der Frage.</p>
   ${(q.media||[]).map((m,j)=>{const[k,kl,ki]=mkind(m.target);const web=/^https?:|^spotify:/.test(m.target||'');const timed=['spotify','audio'].includes(k);
     return `<div class="medit"><div class="hd"><span class="mkind">${ic(ki)}</span><div class="grow small muted">${m.target?kl:'Neues Medium'}</div>${web?`<button class="btn plain" title="Titel automatisch holen" onclick="fetchTitle('${q.id}',${j})">${ic('bolt',14)}Titel holen</button>`:''}${m.target?`<button class="btn icon plain" title="Testen" onclick="runMedia(findQ('${q.id}').media[${j}])">${ic('play',12)}</button>`:''}<button class="btn icon plain danger" title="Entfernen" onclick="delM('${q.id}',${j})">${ic('trash',14)}</button></div>
     <input type="text" placeholder="Link einfügen (Spotify, YouTube, Apple Music, Web) oder Dateiname" list="fl" value="${esc(m.target||'')}" onchange="setTarget('${q.id}',${j},this.value.trim())">
     <input type="text" style="margin-top:6px" placeholder="Bezeichnung" value="${esc(m.label||'')}" onchange="updM('${q.id}',${j},'label',this.value)">
     ${timed?fromSel(q.id,j,m):''}
     <label class="chk"><span class="toggle"><input type="checkbox" ${m.auto?'checked':''} onchange="updM('${q.id}',${j},'auto',this.checked||null);render()"><span></span></span>Beim Aufrufen der Frage automatisch ${k==='spotify'||k==='audio'?'abspielen':'öffnen'}</label></div>`}).join('')}
   <datalist id="fl">${(FILES||[]).map(f=>`<option value="${esc(f.name)}">`).join('')}</datalist>
   <button class="btn" onclick="addM('${q.id}')">${ic('plus',14)}Medium hinzufügen</button>`}
function setOpt(id,j,v){const q=findQ(id);q.opts=q.opts&&q.opts.length?q.opts:['',''];q.opts[j]=v;if(!q.correct)q.correct='A';saveQuiz();render();if(v===''&&j>=2)setTimeout(()=>{const e=document.querySelector(`[data-k="i${id}o${j}"]`);e&&e.focus()},30)}
function delOpt(id,j){const q=findQ(id),c=ABC.indexOf(q.correct);q.opts.splice(j,1);if(c===j)q.correct='A';else if(c>j)q.correct=ABC[c-1];saveQuiz();render()}
function toggleAsk(id,a){const q=findQ(id),s=new Set(q.ask||[]);s.has(a)?s.delete(a):s.add(a);q.ask=ASK.filter(x=>s.has(x));saveQuiz();render()}
function setAns(id,a,v){const q=findQ(id);q.ans={...(q.ans||{}),[a]:v.trim()};if(!v.trim())delete q.ans[a];saveQuiz();render()}
function setSong(id,j,w,v){const q=findQ(id);q.hints=q.hints||[];q.media=q.media||[];const n0=Math.max(q.hints.length,q.media.length);
  while(q.hints.length<=j)q.hints.push('');while(q.media.length<=j)q.media.push({label:'',target:'',dur:30});
  const m=q.media[j];if(w==='t'){q.hints[j]=v.trim();m.label=v.trim()}else{m.target=v.trim();if(m.dur==null)m.dur=30}
  if(!(q.tags||[]).includes('musik'))q.tags=[...(q.tags||[]),'musik'];
  const n=Math.max(q.hints.length,q.media.length);if(n!==n0||(q.pts||[]).length!==n)q.pts=hintPts(n,+q.max||5);
  saveQuiz();render();if(w==='l'&&v&&!m.label)fetchTitle(id,j,true).then(()=>{const x=findQ(id);if(x&&x.media[j]&&x.media[j].label&&!x.hints[j]){x.hints[j]=x.media[j].label;saveQuiz();render()}}).catch(()=>{});
  if(w==='t'&&j>=n0)setTimeout(()=>{const e=document.querySelector(`[data-k="i${id}st${j}"]`);e&&e.focus()},30)}
function delSong(id,j){const q=findQ(id);(q.hints||[]).splice(j,1);(q.media||[]).splice(j,1);q.pts=hintPts(Math.max(q.hints.length,q.media.length),+q.max||5);saveQuiz();render()}


/* ---------- Blöcke: Punkte je Feld ---------- */
const slv=(q,t)=>(((S.slotpts||{})[q.id]||{})[t]||{});
function slotPts(q,tid){const v=slv(q,tid),per=+q.per||1,opts=Array.from({length:per+1},(_,i)=>i);
  return `<div class="slp">${q.slots.map((x,k)=>`<div class="slr"><span class="sll">${esc(x.l)}</span><span class="sla ${locked()?'scr':''}">${esc(X(x.a||''))}</span><div class="seg">${opts.map(o=>`<button class="${v[k]===o?'on':''}" onclick="setSlot('${q.id}','${tid}',${k},${v[k]===o?'null':o})">${o}</button>`).join('')}</div></div>`).join('')}
   <div class="slf"><button class="btn link small" onclick="setSlotsAll('${q.id}','${tid}',${per})">Alle richtig</button><button class="btn link small" onclick="setSlotsAll('${q.id}','${tid}',0)">Alle falsch</button></div></div>`}
function setSlot(qid,tid,k,val){const q=findQ(qid),v={...slv(q,tid)};if(val===null)delete v[k];else v[k]=val;const keys=Object.keys(v);
  setOps([{path:['slotpts',qid,tid],value:keys.length?v:null},{path:['points',qid,tid],value:keys.length?keys.reduce((a,x)=>a+v[x],0):null}]).then(render)}
function setSlotsAll(qid,tid,val){const q=findQ(qid),v={};q.slots.forEach((_,k)=>v[k]=val);setOps([{path:['slotpts',qid,tid],value:v},{path:['points',qid,tid],value:val*q.slots.length}]).then(render)}
/* ---------- Editor: Fragen zu einem Block zusammenführen ---------- */
const slotLabel=t=>{const m=String(t||'').match(/(Nr\.\s*\d+|\d+)\s*\??\s*$/);return m?m[1]:String(t||'').slice(0,24)};
function mergeNext(i){const r=Q.rounds[ui.edR],q=r.qs[i],n=r.qs[i+1];if(!n)return toast('Darunter steht keine Frage mehr');
  ask('Zu einem Block zusammenführen?',`„${qText(n).slice(0,60)}“ wird ein weiteres Feld dieser Frage. Das passt für Fragen, die zum selben Bogen gehören, etwa mehrere Nummern auf einer Karte.`,'Zusammenführen',()=>{
    if(!hasSlots(q)){q.slots=[{l:slotLabel(q.text),a:solution(q)}];q.per=+q.max||1;['accept','show','half'].forEach(k=>delete q[k])}
    q.slots.push({l:slotLabel(n.text),a:solution(n)});q.time=(+q.time||0)+(+n.time||0);
    const seen=new Set((q.media||[]).map(m=>m.target));(n.media||[]).forEach(m=>{if(!seen.has(m.target)){(q.media=q.media||[]).push(m);seen.add(m.target)}});
    q.max=fmtMax(q);r.qs.splice(i+1,1);saveQuiz(true);render();toast(`Block mit ${q.slots.length} Feldern`)})}
function slotsEditor(q){return `<label class="fld"><span>Felder dieses Blocks, eins pro Zeile: Feld = Lösung</span><textarea data-k="i${q.id}sl" style="min-height:${hasSlots(q)?Math.min(220,40+q.slots.length*21):64}px" placeholder="Nr. 4 = Buddenturm" onchange="setSlots('${q.id}',this.value)">${esc((q.slots||[]).map(x=>`${x.l} = ${x.a}`).join('\n'))}</textarea><span class="hint">Für Bögen mit mehreren Antworten, etwa Karten oder Bilderrätsel. Beim Auswerten hakst du jedes Feld einzeln ab.</span></label>
   ${hasSlots(q)?`<label class="fld"><span>Punkte je Feld</span><input type="number" min="1" data-k="i${q.id}pf" value="${+q.per||1}" onchange="upd('${q.id}','per',+this.value||1);findQ('${q.id}').max=fmtMax(findQ('${q.id}'));saveQuiz();render()"></label>`:''}`}
function setSlots(id,v){const q=findQ(id),sl=lines(v).map(x=>{const[a,...b]=x.split('=');return {l:a.trim(),a:b.join('=').trim()}}).filter(x=>x.l);
  if(sl.length){q.slots=sl;if(!q.per)q.per=1;q.max=fmtMax(q)}else delete q.slots;saveQuiz();render()}

/* ---------- Joker ---------- */
function toggleJoker(tid,rid){const cur=jokerOf(tid);set(['joker',tid],cur===rid?null:rid).then(()=>{render();toast(cur===rid?'Joker zurückgenommen':'Joker gesetzt: Punkte dieser Runde zählen doppelt')})}
function jokerBtn(tid,rid){if(!Q.meta.joker)return '';const j=jokerOf(tid),here=j===rid,used=j&&!here;
  return `<button class="btn jkb ${here?'on':''}" ${used?'disabled':''} title="${used?'Joker schon in '+esc((Q.rounds.find(r=>r.id===j)||{}).name||'einer anderen Runde')+' gesetzt':'Punkte dieser Runde doppelt'}" onclick="toggleJoker('${tid}','${rid}')">${here?'Joker gesetzt: doppelte Punkte':used?'Joker verbraucht':'Joker setzen'}</button>`}

/* ======================= Antwortbögen ======================= */
const SHEET_CSS=`.asheet{background:#fff;color:#111;font:12.5px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;width:210mm;min-height:297mm;padding:14mm 15mm 12mm;box-sizing:border-box;display:flex;flex-direction:column}
.asheet header{display:flex;align-items:flex-end;gap:16px;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:6px}
.asheet header .tq{flex:1;min-width:0}.asheet header .tq b{display:block;font-size:11px;font-weight:500;color:#555}.asheet header .tq span{font-size:20px;font-weight:700;letter-spacing:-.02em}
.asheet header .tm{display:flex;gap:14px;align-items:flex-end;font-size:11px;color:#555}.asheet header .tm span{display:inline-block;border-bottom:1px solid #111;width:150px;height:20px}.asheet header .tm .t2{width:44px}
.asheet ol{list-style:none;margin:0;padding:0;flex:1}

/* ---------- Statusband ---------- */
function stBand(){const r=RUN(),st=r.status,pr=isProbe(),{ri,qi,r:rr}=cur()||{};
  const where=rr&&Q.rounds.length?`Runde ${ri+1} von ${Q.rounds.length}, Frage ${qi+1}`:'';
  const txt={idle:`<b>Einlass</b><span>${E().start?`Quiz startet um ${E().start} Uhr`:'Quiz noch nicht gestartet'}${S.teams.length?`, ${S.teams.length} ${S.teams.length===1?'Team':'Teams'} da`:''}</span>`,
    live:`<b data-run>${runText()}</b><span>${where}</span>`,
    pause:`<b data-run>${runText()}</b><span>${r.reason&&r.reason!=='Pause'?esc(r.reason):''}</span>`,
    done:`<b data-run>${runText()}</b><span>Auswerten und Siegerehrung</span>`}[st]||'';
  const tools=pr?`<span class="grow"></span><button class="btn ${E().fast?'on':''}" onclick="toggleFast()" title="Timer und Pausen laufen zehnmal schneller">${E().fast?'Zeitraffer ×10 an':'Zeitraffer'}</button><button class="btn" onclick="testPoints()" title="Zufällige Punkte für eine Runde eintragen">Testpunkte</button><button class="btn" onclick="probeReport()">Probelauf beenden</button>`:'';
  return `<div class="stband st-${st} ${pr?'probe':''}" role="status"><span class="dot"></span>${st==='live'&&!pr?'<span class="onair">On Air</span>':''}${pr?'<span class="pl">Probelauf</span>':''}<span class="tx">${txt}${pr?'<span>Nichts davon zählt.</span>':''}</span>${tools}</div>`}

/* ---------- Probelauf ---------- */
function startProbe(qid){qid=qid||QID;const go2=async()=>{const j=await libPost({action:'trial-start',id:qid});if(!j)return;ui.peek=false;ui.handR=null;ui.after=null;ui.r=0;ui.team=null;toEvent('prep');toast('Probelauf gestartet. 6 Testteams sind schon da.')};
  if(hasEvent()&&isProbe())return go2();
  guardRunning(go2,'Du startest einen Probelauf.')}
function toggleFast(){const on=!E().fast,f=on?.1:10,t=T(),r=RUN(),ops=[{path:['ev','fast'],value:on||null}];
  if(t.dur){const l=left()*f;ops.push({path:['timer'],value:{...t,left:l,end:now()+l,dur:t.dur*f}})}
  if(r.status==='pause'&&r.pauseUntil){ops.push({path:['run'],value:{...r,pauseUntil:now()+Math.max(0,r.pauseUntil-now())*f}})}
  setOps(ops).then(()=>{render();toast(on?'Zeitraffer an: Timer und Pausen laufen zehnmal schneller':'Zeitraffer aus')})}
function testPoints(){const R=ui.mode==='event'&&ui.view==='score'?ui.r:Math.max(0,(cur()||{}).ri||0),r=Q.rounds[R];if(!r||!r.qs.length||!S.teams.length)return toast('Keine Runde oder keine Teams');
  const ops=[];S.teams.forEach((t,ti)=>{r.qs.forEach((q,qi)=>{const f=fmtOf(q),rnd=r01(EID+t.id+q.id);let v;
    if(f==='tiebreak')v=q.val!=null?Math.round(+q.val*(.7+rnd*.6)):Math.round(rnd*100);
    else{const o=options(q);v=o?o[Math.floor(rnd*o.length)]:Math.round(rnd*(fmtMax(q)??(+q.max||0)))}
    ops.push({path:['points',q.id,t.id],value:v})});ops.push({path:['handed',r.id,t.id],value:now()})});
  setOps(ops).then(()=>{render();toast(`Testpunkte für „${r.name}“ eingetragen`)})}
function probeMark(t,ok,msg){if(!hasEvent()||!isProbe()||ui.mode!=='event'||!t)return;set(['probe','m'+r01(t).toString(36).slice(2)],{t,ok:!!ok,msg:ok?null:(msg||'Ging nicht'),at:now()})}
function probeData(){const qs=Q.rounds.flatMap(r=>r.qs),seen=qs.filter(q=>(S.log||{})[q.id]).length;
  const media=[...new Set(qs.flatMap(q=>[...(q.media||[]).map(m=>m.target),q.image]).filter(Boolean))];
  const pm=Object.values(S.probe||{}),tried=new Set(pm.map(x=>x.t)),bad=pm.filter(x=>!x.ok);
  const rounds=Q.rounds.filter(r=>r.qs.length).map(r=>{const ts=r.qs.map(q=>(S.log||{})[q.id]).filter(Boolean),end=(S.ended||{})[r.id];const plan=r.qs.reduce((a,q)=>a+(+q.time||0),0);
    return {name:r.name,plan,started:ts.length>0,real:ts.length&&end?Math.round((end-Math.min(...ts))/60000):null}});
  return {qs:qs.length,seen,media,tried:media.filter(m=>tried.has(m)),untried:media.filter(m=>!tried.has(m)),bad,rounds,warn:quizCheck().filter(x=>x.w)}}
function probeReport(){const d=probeData(),lbl=t=>{const m=Q.rounds.flatMap(r=>r.qs).flatMap(q=>q.media||[]).find(x=>x.target===t);return esc((m&&m.label)||t)};
  const m=sheet('Probebericht',`<div class="muted">So lief der Probelauf von „${esc(Q.meta.title||'Quiz')}“. Korrekturen am Quiz bleiben gespeichert, Teams und Punkte werden verworfen.</div>
   <div class="prep-rep"><div><b>${d.seen} von ${d.qs}</b><span>Fragen angesehen</span></div><div><b>${d.tried.length} von ${d.media.length}</b><span>Songs, Links und Dateien geöffnet</span></div><div><b>${d.bad.length}</b><span>${d.bad.length===1?'Medium ging':'Medien gingen'} nicht</span></div><div><b>${d.warn.length}</b><span>${d.warn.length===1?'Problem':'Probleme'} unter „Prüfen“</span></div></div>
   ${d.bad.length?`<div class="gt">Ging nicht</div><ul class="prep-list">${d.bad.map(x=>`<li><span class="w">${ic('warn',13)}</span><span class="grow">${lbl(x.t)}<div class="faint small">${esc(x.msg||'')}</div></span></li>`).join('')}</ul>`:''}
   <div class="gt">Zeit je Runde${E().fast?' <span class="faint small">(mit Zeitraffer gemessen)</span>':''}</div><ul class="prep-list">${d.rounds.map(r=>`<li><span class="grow">${esc(r.name)}</span><span class="${r.real!=null&&r.real>r.plan*1.15?'w':'muted'}">${r.real==null?(r.started?'noch nicht beendet':'nicht gespielt'):`${r.real} Min.`}</span><span class="faint small">geplant ${r.plan} Min.</span></li>`).join('')}</ul>
   ${d.untried.length?`<div class="gt">Nicht geöffnet</div><div class="muted small" style="line-height:1.7">${d.untried.slice(0,12).map(lbl).join(', ')}${d.untried.length>12?` und ${d.untried.length-12} weitere`:''}</div>`:''}
   ${d.warn.length?`<div class="gt">Unter „Prüfen“</div><ul class="prep-list">${d.warn.slice(0,6).map(x=>`<li><span class="w">${ic('warn',13)}</span><span class="grow">${esc(x.t)}</span></li>`).join('')}</ul>`:''}`,
   `<button class="btn" onclick="closeModals()">Weiter proben</button><button class="btn" onclick="endProbe(true)">Noch mal von vorne</button><button class="btn pri" onclick="endProbe(false)">Probelauf verwerfen</button>`);
  m.querySelector('.box').classList.add('rep')}
async function endProbe(restart){closeModals();const qid=QID,eid=EID;const t=T();if(t.running)await set(['timer'],{running:false,end:0,left:0,dur:0});
  const j=await libPost({action:'trial-end',id:qid,eid,restart:!!restart});if(!j)return;ui.peek=false;ui.r=0;ui.team=null;ui.after=null;

/* ---------- Abspielen: Anfang, feste Stelle oder zufällig ---------- */
function playPlan(m){const P=Q.meta.play||{},fixed=m.from==='fixed'||(m.from==null&&m.start!=null&&m.start!=='');
  const mode=fixed?'fixed':(m.from||P.mode||'start'),dur=+m.dur||+P.dur||0;
  return {mode,pos:mode==='fixed'?(+m.start||0):0,frac:mode==='random'?+(0.15+0.55*r01((EID||'')+'|'+m.target)).toFixed(4):0,dur}}
async function spot(a,enc){const m=enc?JSON.parse(decodeURIComponent(enc)):{},pp=playPlan(m);
  const j=await post('/api/spotify',{action:a,uri:m.target,pos:pp.pos,frac:pp.frac,dur:pp.dur});
  if(a==='play')probeMark(m.target,j.ok,j.msg);
  if(!j.ok)toast(j.msg||'Spotify reagiert nicht');
  else if(a==='play')toast(j.note?j.note:INFO.win?(pp.mode!=='start'?'In Spotify geöffnet. Unter Windows startet der Song am Anfang.':'In Spotify geöffnet'):`Spotify spielt${pp.mode==='random'?' ab zufälliger Stelle':pp.pos?` ab Sekunde ${pp.pos}`:''}${pp.dur?`, ${pp.dur} Sekunden`:''}`)}
function playLocal(enc){const m=JSON.parse(decodeURIComponent(enc)),pp=playPlan(m);clearInterval(fi);clearTimeout(st);if(QM.remote)return openT(m.target);audio.src=QM.files.url(m.target)||'';audio.volume=1;
  audio.onerror=()=>{probeMark(m.target,false,'Datei lässt sich nicht abspielen');toast('Datei lässt sich nicht abspielen')};
  audio.onloadedmetadata=()=>{const L=audio.duration||0;let p=pp.pos;if(pp.mode==='random'&&L)p=Math.max(0,Math.min(pp.frac*L,L-(pp.dur||0)-2));if(p)audio.currentTime=p;audio.play();probeMark(m.target,true);if(pp.dur)st=setTimeout(fadeLocal,pp.dur*1000)};audio.load()}
async function openT(t){const j=await post('/api/open',{target:t});probeMark(t,j.ok,j.msg);if(j.ok&&j.note===false)return;toast(j.ok?(j.note||'Geöffnet'):j.msg||'Öffnen fehlgeschlagen')}

function quizCheck(){const out=[];const fl=new Set((FILES||[]).map(f=>f.name));
  
  Q.rounds.forEach((r,ri)=>{if(!r.qs.length)out.push({w:1,ri,t:`„${r.name}“ hat noch keine Fragen`});
    r.qs.forEach((q,qi)=>{const at={ri,qi,id:q.id};const k=kind(q);
      if(!String(q.text||'').trim())out.push({...at,w:1,t:'Frage ohne Text'});
      if(k!=='manual'&&!String(solution(q)||'').trim())out.push({...at,w:1,t:'Keine Lösung hinterlegt'});
      if(k==='hint'&&!(q.hints||[]).length)out.push({...at,w:1,t:'Hinweisrunde ohne Hinweise'});
      if(k==='hint'&&(q.hints||[]).length&&(q.pts||[]).length&&(q.pts||[]).length!==(q.hints||[]).length)out.push({...at,w:0,t:`${q.hints.length} Hinweise, aber ${q.pts.length} Punktwerte`});

function hash(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}

  const lo='bcdfghjklmnpqrstvwxzaeiouyäöü',up=lo.toUpperCase();return str.replace(/[A-Za-zÄÖÜäöüß]/g,c=>{const L=c===c.toUpperCase()&&c!==c.toLowerCase()?up:lo;return L[Math.floor(rnd()*L.length)]}).replace(/\d/g,()=>String(Math.floor(rnd()*10)))}

function roundMedia(r,ri,qi){const groups=[];r.qs.forEach((x,j)=>{const it=[];if(x.image)it.push({label:'Bild',target:x.image});(x.media||[]).filter(m=>m.target).forEach(m=>it.push(m));if(it.length)groups.push([j,it])});

     :`<div class="empty"><h3>Noch keine Runden</h3><button class="btn pri" onclick="addRound()">Erste Runde anlegen</button></div>`}</div>
   ${rz('insp',-1)}<div class="insp" data-scroll="insp">${ui.edCheck?vCheck():q?inspector(q):`<div class="muted" style="padding-top:6px">Wähle eine Frage aus, um sie zu bearbeiten.</div>
     <div class="gt" style="margin-top:28px">Dateien</div><div class="drop" id="drop">Bilder, PDFs oder Audiodateien hierher ziehen<div style="margin-top:8px"><label class="btn">Auswählen<input type="file" multiple style="display:none" onchange="upload(this.files)"></label></div></div>
     <div class="small faint" style="margin-top:10px;line-height:1.7">${(FILES||[]).map(f=>esc(f.name)).join('<br>')||'Noch keine Dateien'}</div>`}</div>
  </div></div>`}
const lines=s=>String(s).split('\n').map(x=>x.trim()).filter(Boolean);
function hintPts(n,max){max=max||5;if(n<=0)return [];if(n===1)return [max];return Array.from({length:n},(_,i)=>Math.max(1,Math.round(max-(max-1)*i/(n-1))))}
function upd(id,f,v){const q=findQ(id);if(v===null||v===undefined)delete q[f];else q[f]=v;
  if(f==='hints'&&Array.isArray(v)&&(q.pts||[]).length!==v.length){q.pts=hintPts(v.length,+q.max||5);setTimeout(()=>{render();toast(`Punkte an ${v.length} Hinweise angepasst: ${q.pts.join(', ')}`)},0)}
  if(f==='type'){if(v==='hint'&&!q.hints){q.hints=[];q.pts=[5,4,3,2,1]}if(v==='risk'||v==='hint')q.max=5;else if(['std','num','mc','multi'].includes(v)&&(q.max>3||!q.max))q.max=2;
    if(v==='num'&&q.full==null){q.full=10;q.half=20;q.pct=true}if(v==='mc'&&!q.opts){q.opts=[];q.correct='A'}}
  saveQuiz();if(['type','max','time','image','show','paper','opts','val','pct','unit','parts','correct'].includes(f))render()}
const ABC='ABCDEFGH';
function toggleTag(id,k){const q=findQ(id);const t=new Set(q.tags||[]);t.has(k)?t.delete(k):t.add(k);q.tags=[...t];if(!q.tags.length)delete q.tags;saveQuiz();render()}
function setTarget(id,j,v){const q=findQ(id),m=q.media[j];m.target=v;const k=mkind(v)[0];
  if(kindTag[k]&&!(q.tags||[]).length){q.tags=[kindTag[k]];toast(`Label „${tagOf(kindTag[k])[1]}“ gesetzt`)}
  saveQuiz();render();if(!m.label&&/^https?:|^spotify:/.test(v))fetchTitle(id,j,true)}
function updM(id,j,f,v){const q=findQ(id);if(v===null)delete q.media[j][f];else q.media[j][f]=v;saveQuiz()}
function addM(id){const q=findQ(id);(q.media=q.media||[]).push({label:'',target:''});saveQuiz();render()}
function delM(id,j){findQ(id).media.splice(j,1);saveQuiz();render()}
function addRound(){Q.rounds.push({id:'r'+uid(),name:`Runde ${Q.rounds.length+1}`,pause:0,qs:[]});ui.edR=Q.rounds.length-1;ui.edQ=null;saveQuiz();render()}
function delRound(){const r=Q.rounds[ui.edR];ask(`„${r.name}“ löschen?`,`Die Runde und ihre ${r.qs.length} Fragen werden entfernt.`,'Löschen',()=>{Q.rounds.splice(ui.edR,1);ui.edR=Math.max(0,ui.edR-1);ui.edQ=null;saveQuiz(true);render()},true)}
function moveRound(d){const a=Q.rounds,i=ui.edR;[a[i],a[i+d]]=[a[i+d],a[i]];ui.edR=i+d;saveQuiz();render()}
function delQ(i){ask('Frage löschen?','Die Frage und alle dazu erfassten Antworten werden entfernt.','Löschen',()=>{Q.rounds[ui.edR].qs.splice(i,1);ui.edQ=null;saveQuiz(true);render()},true)}
function moveQ(i,d){const a=Q.rounds[ui.edR].qs;if(i+d<0||i+d>=a.length)return;[a[i],a[i+d]]=[a[i+d],a[i]];saveQuiz();render()}
function dupQ(i){if(!Q.rounds[ui.edR])return;const a=Q.rounds[ui.edR].qs,c=JSON.parse(JSON.stringify(a[i]));c.id='q'+uid();a.splice(i+1,0,c);ui.edQ=c.id;saveQuiz();render()}
async function upload(files){files=[...files];const have=new Set((FILES||[]).map(f=>f.name)),dup=files.filter(f=>have.has(f.name));
  const go=async()=>{for(const f of files)await fetch('/api/upload?name='+encodeURIComponent(f.name),{method:'POST',body:f});toast(dup.length?(files.length===1?'Datei ersetzt':`${files.length} Dateien übernommen, ${dup.length} davon ersetzt`):files.length===1?'Datei hinzugefügt':`${files.length} Dateien hinzugefügt`);await loadFiles();BANK=null;render()};
  if(!dup.length)return go();
  return new Promise(res=>ask(dup.length===1?`„${dup[0].name}“ ersetzen?`:`${dup.length} Dateien ersetzen?`,`${dup.length===1?'Eine Datei':'Dateien'} mit diesem Namen ${dup.length===1?'gibt':'gibt'} es schon. Die neue Fassung übernimmt den Platz, alle Fragen zeigen dann sie. Die alte landet im Papierkorb.`,'Ersetzen',()=>go().then(res)))}
function fileReplace(name){const i=document.createElement('input');i.type='file';i.onchange=async()=>{const f=i.files[0];if(!f)return;const j=await (await fetch('/api/upload?replace='+encodeURIComponent(name),{method:'POST',body:f})).json();if(j.ok===false)return toast(j.msg||'Ersetzen ging nicht');toast(`„${name}“ ersetzt, die alte Fassung liegt im Papierkorb`);await loadFiles();BANK=null;render()};i.click()}
function fileDel(name){const u=(mediaUse()[name]||{refs:[]}).refs,n=new Set(u.map(x=>x.qid+x.q.id)).size;
  ask(`„${name}“ löschen?`,(n?`Die Datei steht noch in ${n===1?'einer Frage':`${n} Fragen`}. Dort fehlt sie danach, die Prüfung im Editor zeigt das an. `:'')+'Sie landet im Papierkorb (Einstellungen › Daten) und lässt sich von dort zurückholen.','Löschen',async()=>{const j=await post('/api/file-delete',{name});if(j.ok===false)return toast(j.msg||'Löschen ging nicht');toast('Gelöscht, liegt im Papierkorb');await loadFiles();BANK=null;render()},true)}
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();upload(e.dataTransfer.files)}});

/* ======================= Bibliothek ======================= */
let LIBR=null;
function applyTpl(id){ask('Neue Fassung übernehmen?','Fragen, Lösungen, Songs und Karten werden aktualisiert. Teams, Punkte, Notizen und dein Sichtschutz-Code bleiben. Dein bisheriger Stand wird vorher als Kopie „(Sicherung …)“ unter „Meine Quizze“ abgelegt.','Übernehmen',async()=>{const j=await post('/api/library',{action:'template-update',id});if(j.ok===false)return toast(j.msg);LIBR=null;FILES=null;await load();render();if(ui.mode==='edit'&&ui.edId)openEditor(ui.edId);toast('Neue Fassung übernommen')})}

/* ======================= Einstellungen ======================= */
function setTheme(k){document.documentElement.dataset.theme=k;try{localStorage.setItem('qm-theme',k)}catch(e){}render()}
function backup(){dl(`${(Q.meta.title||'quiz').replace(/\W+/g,'-')}-sicherung-${new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')}.json`,JSON.stringify({quiz:Q,state:S},null,1),'application/json')}
async function restore(f){if(!f)return;let d;try{d=JSON.parse(await f.text())}catch(e){return toast('Die Datei ist keine gültige Sicherung')}
  ask('Sicherung laden?','Der aktuelle Stand dieses Quiz wird ersetzt.','Laden',async()=>{await post('/api/restore',d);await load();render();toast('Sicherung geladen')})}
function resetAll(k){ask(k?'Abend zurücksetzen?':'Alles zurücksetzen?',k?'Antworten und Punkte werden gelöscht, die Teams bleiben.':'Antworten, Punkte und Teams werden gelöscht.','Zurücksetzen',async()=>{await post('/api/reset',{keepTeams:k});await load();render();toast('Zurückgesetzt')},true)}

/* ======================= Dialoge ======================= */
function ask(title,text,okL,fn,danger){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box"><h3>${esc(title)}</h3><div class="muted">${esc(text)}</div>
  <div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn" data-x>Abbrechen</button><button class="btn pri" style="${danger?'background:var(--bad);border-color:var(--bad);color:#fff':''}" data-ok>${esc(okL)}</button></div></div>`;
  document.body.appendChild(m);m.querySelector('[data-x]').onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove()};m.querySelector('[data-ok]').onclick=()=>{m.remove();fn()};m.querySelector('[data-ok]').focus()}
function prompt2(title,label,okL,fn,val){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box"><h3>${esc(title)}</h3><label class="fld" style="margin-top:10px"><span>${esc(label)}</span><input type="text" value="${esc(val||'')}"></label>
  <div class="row" style="justify-content:flex-end;margin-top:6px"><button class="btn" data-x>Abbrechen</button><button class="btn pri" data-ok>${esc(okL)}</button></div></div>`;
  document.body.appendChild(m);const i=m.querySelector('input');const ok=()=>{const v=i.value.trim();if(!v)return;m.remove();fn(v)};
  m.querySelector('[data-x]').onclick=()=>m.remove();m.querySelector('[data-ok]').onclick=ok;i.onkeydown=e=>{if(e.key==='Enter')ok()};i.focus();i.select()}

/* ======================= Start ======================= */
const BUILD=13;QM.app={get S(){return S},get Q(){return Q},render:()=>render(),toast:t=>toast(t),load:()=>load()};
applyWidths();
(async()=>{try{await load()}catch(e){$('#app').innerHTML='<div class="empty" style="padding-top:20vh"><h3>QuizMaster konnte nicht starten</h3>'+QM.ui.bootError(e)+'</div>';return}
  if(IS_BEAMER){document.body.classList.add('beamer');document.title=(Q.meta.title||'Quiz')+' – Beamer';renderBeam()}else{ui._scrollTo=true;render()}
  ui.mode=!LOCAL?'event':(isRunning()&&hasEvent())?'event':(ui.mode==='edit'&&ui.edId)?'edit':'home';if(ui.mode==='home'&&!ui.page)ui.page='today';if(ui.mode==='event')ui.view=RUN().status==='idle'?'prep':'live';
  if(ui.mode==='edit')await setMode('edit',{edId:ui.edId,noPush:true});else render();try{history.replaceState({mode:ui.mode,view:ui.view,edId:ui.edId,edTab:ui.edTab,page:ui.page},'')}catch(e){}
  listen();setInterval(tick,200)})();
</script>
